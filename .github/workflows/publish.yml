name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    name: Publish to npm
    runs-on: ubuntu-latest # trusted publishing only works on hosted runners
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Install a pinned npm with trusted-publishing support (>= 11.5.1)
        run: npm install -g npm@11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test

      - name: Publish (OIDC trusted publishing, provenance automatic)
        run: npm publish --provenance

  # Mirrors the release to GitHub Packages so it is listed on the repository
  # page. GitHub's npm registry only accepts scoped names, so the mirror is
  # published as @psylsph/milsymbol-sidc; npm keeps the unscoped name. A
  # separate job means a failure here can be re-run without re-publishing to
  # npm (which would fail on the already-published version).
  github-packages:
    name: Publish to GitHub Packages
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com/
          scope: "@psylsph"

      - name: Install dependencies
        run: npm ci

      - name: Use the scoped name required by GitHub Packages
        run: npm pkg set name=@psylsph/milsymbol-sidc

      - name: Publish
        run: npm publish --registry https://npm.pkg.github.com/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
